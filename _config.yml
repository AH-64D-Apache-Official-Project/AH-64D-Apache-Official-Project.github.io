title: AH-64D Apache Longbow
subtitle: Field Manual
version: "3.0"
description: The player's manual for the AH-64D Apache Longbow Official Project mod for Arma 3.
url: https://ah-64d-apache-official-project.github.io
baseurl: ""

links:
  steam: https://steamcommunity.com/sharedfiles/filedetails/?id=1351428303
  discord: https://discord.gg/rB6yDDy
  github: https://github.com/AH-64D-Apache-Official-Project/AH-64D
  issues: https://github.com/AH-64D-Apache-Official-Project/AH-64D/issues
  docs_repo: https://github.com/AH-64D-Apache-Official-Project/AH-64D-Apache-Official-Project.github.io

permalink: pretty
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge
  parse_block_html: true

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: doc

exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - vendor
  - README.md
  - LICENSE
  - _tools
  - images/mpd/*.xcf
  - images/mpd/*.psd

# Liquid tag delimiters, used by search.json to drop tags from page text
liquid_open: "{%"
liquid_close: "%}"
