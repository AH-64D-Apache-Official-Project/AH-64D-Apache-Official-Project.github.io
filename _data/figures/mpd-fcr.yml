title: FCR page, GTM
kind: mpd
caption: 'FCR page, GTM format, wide scan size, continuous scanburst. The CPG has the FCR as the selected sight and missiles actioned.'
state:
  page: FCR
  src: { heading: 312 }
  u:
    MFD_IND_FCR_MODE: 1
    MFD_IND_FCR_SIGHT_FCR: 1
    MFD_IND_FCR_ARROW_L: 1
    MFD_IND_FCR_ARROW_R: 1
    MFD_IND_FCR_TGT_AVAIL: 1
    MFD_IND_FCR_LINE_SHOW: 1
    MFD_IND_FCR_ANIM: 0.4
    MFD_IND_FCR_SCAN_TYPE: 2
    MFD_IND_FCR_COMMAND_HEADING: 20
    MFD_IND_FCR_CENTERLINE: 0
    MFD_IND_FCR_PREV_CENTER: 0
    MFD_IND_FCR_ACQ_BOX: 3
  t:
    MFD_TEXT_IND_FCR_SSS: C-FCR
    MFD_TEXT_IND_FCR_RRS: R3.8
    MFD_TEXT_IND_FCR_COUNT: '6'
    MFD_TEXT_IND_FCR_ACQ_SRC: FXD
    MFD_TEXT_IND_FCR_WC: CMSL
  fcr:
    mode: 1
    targets:
    - { icon: aduLOAL, a: -20, r: 4600 }
    - { icon: trackLOBL, a: 4, r: 1300 }
