    - { icon: unkLOAL, a: -42, r: 2900, dim: true }
callouts:
- { n: 1, x: 500, y: 75, side: t, label: Heading scale, text: 'With the FCR centerline bearing below the lubber line, and the command heading chevron.' }
- { n: 2, x: 957, y: 60, side: r, label: Total target count status window, text: 'Total number of targets detected within the scanburst.' }
- { n: 3, x: 155, y: 300, side: l, label: Scan sector symbol, text: 'Range arcs at 2, 4, 6 and 8 km. The sector follows the selected scan size.' }
- { n: 4, x: 385, y: 593, side: l, label: Scan wiper symbol, text: 'Moves across the scan sector with the antenna while the FCR is transmitting: white during a single scanburst, green during continuous scan.' }
- { n: 5, x: 570, y: 569, side: r, label: NTS and ANTS symbols, text: 'NTS symbol (diamond): the highest priority target. ANTS symbol (triangle): the alternate next-to-shoot.' }
- { n: 6, x: 372, y: 518, side: l, label: FCR target symbols, text: 'Target type, and moving or stationary. See the table below.' }
- { n: 7, x: 220, y: 940, side: b, label: Sight select status, range and range source, text: 'HAD sight select status and range and range source status fields.' }
- { n: 8, x: 500, y: 940, side: b, label: FOR symbols, text: 'Field of regard: the field of view box (TADS) and the cued LOS dot (acquisition source).' }
- { n: 9, x: 780, y: 940, side: b, label: Weapon status, text: 'HAD weapon status field: the actioned weapon.' }
