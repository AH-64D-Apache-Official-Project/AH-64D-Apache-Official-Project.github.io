- { n: 3, x: 155, y: 300, side: l, label: Scan sector, text: "Range arcs every 2 km out to 8 km. The sector width follows the scan size." }
- { n: 4, x: 385, y: 593, side: l, label: Scan bar, text: "Sweeps across the sector while the radar scans." }
- { n: 5, x: 570, y: 569, side: r, label: NTS, text: "The next-to-shoot target, in the diamond. The triangle marks the alternate, the ANTS." }
- { n: 6, x: 372, y: 518, side: l, label: Targets, text: "One symbol per target: what it is and whether it is moving. See the table below." }
- { n: 7, x: 220, y: 940, side: b, label: Sight and range, text: "Your sight, and the range and its source." }
- { n: 8, x: 500, y: 940, side: b, label: Sensor window, text: "Where the TADS looks (the box) and where your acquisition source points (the diamond)." }
- { n: 9, x: 780, y: 940, side: b, label: Weapon, text: "The weapon actioned." }
