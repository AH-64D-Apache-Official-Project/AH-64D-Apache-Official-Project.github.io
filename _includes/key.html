{% assign k = site.data.keybinds[include.id] %}{% if k %}<span class="bind" title="{{ k.desc | escape }}"><span class="bind-name">{{ k.name }}</span>{% if k.keys %}<span class="bind-keys">{% for key in k.keys %}<kbd>{{ key }}</kbd>{% unless forloop.last %}+{% endunless %}{% endfor %}</span>{% elsif k.vanilla %}<span class="bind-keys unbound">game binding</span>{% else %}<span class="bind-keys unbound">unbound</span>{% endif %}</span>{% else %}<span class="bind missing">{{ include.id }}</span>{% endif %}
